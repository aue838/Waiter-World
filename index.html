    <!-- Separate Firebase Daily Tracker Script -->
    <script type="module">
      import { getDatabase, ref, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

      function incrementDailyStat(statType) {
          const db = getDatabase();
          const today = new Date().toISOString().split('T')[0];
          const statRef = ref(db, `stats/daily/${today}/${statType}`);

          runTransaction(statRef, (currentVal) => {
              return (currentVal || 0) + 1;
          }).catch((error) => {
              console.error("Failed to update daily stat: ", error);
          });
      }

      incrementDailyStat('views');
    </script>

<script>
  function setLanguage(lang) {
    localStorage.setItem('preferredLang', lang);
    applyLanguage(lang);
  }

  function applyLanguage(lang) {
    document.querySelectorAll('[data-translate]').forEach(el => {
      const key = el.getAttribute('data-translate');
      if (typeof translations !== 'undefined' && translations[lang] && translations[lang][key]) {
        el.innerText = translations[lang][key];
      }
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('preferredLang') || 'en';
    applyLanguage(savedLang);
  });
</script>
