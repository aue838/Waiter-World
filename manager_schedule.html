<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="pageTitle">Staff Schedule - Monthly View</title>
    <style>
        :root {
            --calendar-bg: #fdfaf0;
            --border-color: #d1c7ac;
            --highlight-week: rgba(0, 255, 204, 0.2);
            --header-bg: #4b2c15;
            --neon-accent: #00ffcc;
        }

body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Dark office wall texture using a radial gradient */
            background-color: #1a1a1a;
            background-image: radial-gradient(#333 0.0625rem, transparent 0.0625rem);
            background-size: 1.25rem 1.25rem; 
            margin: 0;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }        

        .controls {
            margin-bottom: 1.25rem;
            display: flex;
            gap: 0.625rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 0.625rem 1.25rem;
            cursor: pointer;
            background: var(--header-bg);
            color: white;
            border: none;
            border-radius: 0.25rem;
            font-weight: bold;
        }

        button:hover { background: #633a1c; }

        #calendar-container {
            background: var(--calendar-bg);
            /* Subtle paper texture effect */
            background-image: linear-gradient(rgba(0,0,0,0.02) 0.0625rem, transparent 0.0625rem),
                     linear-gradient(90deg, rgba(0,0,0,0.02) 0.0625rem, transparent 0.0625rem);
            background-size: 1.25rem 1.25rem;
    
            border: 0.5rem solid #3d2b1f; /* Thick "wooden frame" border */
            width: 95vw;
            max-width: 62.5rem;
            margin: 0 auto;
            box-shadow: 0 1.25rem 3.125rem rgba(0,0,0,0.8), inset 0 0 6.25rem rgba(0,0,0,0.05);
            border-radius: 0.25rem;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: var(--header-bg);
            color: white;
            text-align: center;
            font-weight: bold;
        }

        .day-label { padding: 0.625rem 0; border: 0.0625rem solid #333; }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            width: 100%;
        }

        .calendar-day {
            min-height: 7.5rem;
            border: 0.0625rem solid var(--border-color);
            padding: 0.3125rem;
            position: relative;
        }

        .day-number { font-weight: bold; margin-bottom: 0.3125rem; display: block; }

        /* Highlight the current week */
        .current-week { background-color: var(--highlight-week); }

        textarea {
            width: 90%;
            height: 5rem;
            border: none;
            background: transparent;
            font-size: 0.8rem;
            resize: none;
            outline: none;
        }
        
        /* Highlight for the current specific day */
.today-highlight { 
    border: 0.1875rem solid #d32f2f !important; 
    background-color: #fff0f0 !important; 
} 
        
        /* Style the container for each staff row */
#shift-list > div {
    background: rgba(255, 255, 255, 0.05); /* Very faint background */
    padding: 0.625rem;
    border-radius: 0.375rem;
    border-left: 0.25rem solid var(--neon-accent, #00ffcc); /* Accent bar on the side */
    margin-bottom: 0.75rem !important; /* Space between people */
}

/* Zebra striping: every second row gets a slightly lighter background */
#shift-list > div:nth-child(even) {
    background: rgba(255, 255, 255, 0.1);
}

/* Make the inputs look a bit more professional inside the rows */
#shift-list input {
    border: 0.0625rem solid #555;
    background: #222;
    color: white;
    font-size: 1rem;
}

.nav-container {
    padding: 1.25rem;
    background: #2c3e50;
    display: flex;
    justify-content: flex-start;
    width: 100%;
    box-sizing: border-box;
}

.btn-return {
    text-decoration: none;
    color: white;
    background: #009933;
    padding: 0.625rem 1.25rem;
    border-radius: 0.3125rem;
    font-family: sans-serif;
    font-weight: bold;
    transition: background 0.3s;
}

.btn-return:hover {
    background: #a93226;
}
@media screen and (max-width: 37.5rem) {
    .controls {
        display: grid;
        grid-template-columns: repeat(2, 1fr); 
        width: 100%;
        gap: 0.3125rem;
    }

    /* Target the class to match your desktop selector */
    .calendar-grid {
        display: block !important; /* Stack days vertically */
        padding: 0.625rem;
    }

    .calendar-day {
        width: 100% !important;
        box-sizing: border-box; /* Prevents horizontal scroll */
        min-height: auto;
        margin-bottom: 0.625rem;
        border: 0.125rem solid var(--border-color);
    }

    .day-headers {
        display: none !important; 
    }

    #day-modal > div {
        width: 95%;
        margin: 0.625rem auto;
    }
}

@media print {
    /* Hide the manager tools */
    .controls, button, #day-modal, #custom-settings {
        display: none !important;
    }
    
    body {
        background: white !important;
        background-image: none !important;
        padding: 0 !important;
    }

    #calendar-container {
        width: 100% !important;
        max-width: none !important;
        border: 0.0625rem solid #000 !important;
        box-shadow: none !important;
        background: white !important;
    }

    .calendar-header, .day-headers {
        background: #eee !important;
        color: black !important;
        border-bottom: 0.125rem solid #000 !important;
    }

    .calendar-day {
        min-height: 6.25rem !important;
        border: 0.0625rem solid #ddd !important;
    }
}

  function setLanguage(lang) {
    localStorage.setItem('preferredLang', lang);
    applyLanguage(lang);
    initCalendar(); // Re-render calendar to update dynamic strings & months
  }

  function applyLanguage(lang) {
    const t = translations[lang];
    if (!t) return;

    document.title = t.pageTitle;

    document.querySelectorAll('[data-translate]').forEach(el => {
      const key = el.getAttribute('data-translate');
      if (t[key]) {
        el.innerHTML = t[key];
      }
    });

    document.querySelectorAll('[data-translate-placeholder]').forEach(el => {
      const key = el.getAttribute('data-translate-placeholder');
      if (t[key]) {
        el.placeholder = t[key];
      }
    });
  }

const grid = document.getElementById('days-grid');
const monthLabel = document.getElementById('month-name');
let currentEditingDay = null;

function initCalendar() {
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const today = now.getDate();

    const lang = localStorage.getItem('preferredLang') || 'en';
    const t = translations[lang];

    monthLabel.innerText = `${t.months[month]} ${year}`;

    const firstDayIndex = new Date(year, month, 1).getDay();
    const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
    const prevMonthLastDay = new Date(year, month, 0).getDate();
    
    grid.innerHTML = '';

    for (let i = 0; i < 42; i++) {
        let day, displayMonth, displayYear;
        
        if (i < firstDayIndex) {
            day = prevMonthLastDay - firstDayIndex + i + 1;
            displayMonth = month === 0 ? 11 : month - 1;
            displayYear = month === 0 ? year - 1 : year;
        } else if (i >= firstDayIndex + lastDayOfMonth) {
            day = i - (firstDayIndex + lastDayOfMonth) + 1;
            displayMonth = month === 11 ? 0 : month + 1;
            displayYear = month === 11 ? year + 1 : year;
        } else {
            day = i - firstDayIndex + 1;
            displayMonth = month;
            displayYear = year;
        }
const dayDiv = document.createElement('div');
        dayDiv.classList.add('calendar-day');
        dayDiv.style.cursor = "pointer";
        // Pass the full date info to the modal
        dayDiv.setAttribute('onclick', `openModal(${day}, ${displayMonth}, ${displayYear})`);

        // Style non-current month days
        if (displayMonth !== month) {
            dayDiv.style.background = "#f0f0f0";
        }

        // Highlight TODAY specifically
        if (day === now.getDate() && displayMonth === now.getMonth() && displayYear === now.getFullYear()) {
            dayDiv.classList.add('today-highlight');
        }

const savedData = JSON.parse(localStorage.getItem(`shifts-${displayYear}-${displayMonth}-${day}`) || "[]");
        
        // Use displayMonth/displayYear for lookup
        const prevDate = new Date(displayYear, displayMonth, day - 1);
        const yesterdayData = JSON.parse(localStorage.getItem(`shifts-${prevDate.getFullYear()}-${prevDate.getMonth()}-${prevDate.getDate()}`) || "[]");
        
        const workedLateYesterday = yesterdayData
            .filter(s => s.time.toLowerCase().includes("5p") || s.time.toLowerCase().includes("cl"))
            .map(s => s.name.trim().toLowerCase());

        const staffCount = savedData.length;
        const badgeHTML = staffCount > 0 ? `<span style="float:right; background:#4b2c15; color:white; font-size:0.6rem; padding:0.125rem 0.3125rem; border-radius:0.625rem;">${staffCount} ${t.staffBadge}</span>` : '';

        let shiftListHTML = '<div style="margin-top:0.3125rem; font-size:0.7rem; line-height:1.2; clear:both;">';
        
        const nameCounts = {};
        savedData.forEach(s => {
            const n = s.name.trim().toLowerCase();
            nameCounts[n] = (nameCounts[n] || 0) + 1;
        });
        
        let totalHours = 0;
        savedData.forEach(shift => {
            const time = shift.time.toLowerCase();
            if (time.includes("7a-3p")) totalHours += 8;
            else if (time.includes("11a-5p")) totalHours += 6;
            else if (time.includes("5p-cl")) totalHours += 5;
            else if (time !== "") totalHours += 4;
        });

        const budgetHTML = totalHours > 0 ? `<div style="font-size:0.6rem; color:#666; font-style:italic; margin-top:0.125rem; border-top:0.0625rem solid #ddd; padding-top:0.125rem;">${t.totalHoursLabel} ${totalHours} hrs</div>` : '';
        savedData.forEach(shift => {
            const currentName = shift.name.trim().toLowerCase();
            const currentTime = shift.time.toLowerCase();
            
            const isEarlyToday = currentTime.includes("7a") || currentTime.includes("11a");
            const isClopen = workedLateYesterday.includes(currentName) && isEarlyToday;

            let bgColor = "#e2e2e2"; 
            if (currentTime.includes("7a")) bgColor = "#d4f1f9"; 
            if (currentTime.includes("5p")) bgColor = "#f9d4d4"; 
            if (currentTime.includes("11a")) bgColor = "#d4f9e2"; 

            const isDuplicate = nameCounts[currentName] > 1;
            
            let borderColor = "none";
            let shadowStyle = "none";
            let finalBg = bgColor;

            if (isDuplicate) {
                finalBg = "#fff3e0";
                borderColor = "0.125rem solid #ff6600";
            }
            
            if (isClopen) {
                finalBg = "#f3e5f5";
                borderColor = "0.125rem solid #9c27b0";
                shadowStyle = "0 0 0.3125rem rgba(156,39,176,0.5)";
            }

            shiftListHTML += `
                <div style="background:${finalBg}; 
                        border:${borderColor}; 
                        box-shadow:${shadowStyle};
                        padding:0.125rem 0.25rem; margin-bottom:0.0625rem; border-radius:0.125rem; color:#333;">
                    ${isClopen ? '<strong>⚠️ </strong>' : ''}<strong>${shift.time}</strong> ${shift.name}
                </div>`;
        });
        shiftListHTML += '</div>';
        
        const savedEvent = localStorage.getItem(`event-${year}-${month}-${day}`) || "";
        let eventHTML = '';
        if (savedEvent) {
        dayDiv.style.background = "#fff9c4"; // Soft yellow for event days
        eventHTML = `<div style="background:#fbc02d; color:#333; font-size:0.6rem; font-weight:bold; padding:0.125rem; text-align:center; margin-top:0.125rem; text-transform:uppercase;">${savedEvent}</div>`;
        }
        
        dayDiv.innerHTML = `<span class="day-number">${day}</span>${badgeHTML}${eventHTML}${shiftListHTML}${budgetHTML}`;
        grid.appendChild(dayDiv);
    }
}

// MODAL LOGIC
function openModal(day, month, year) {
    currentEditingDay = { day, month, year };
    const lang = localStorage.getItem('preferredLang') || 'en';
    const t = translations[lang];

    document.getElementById('modal-date-title').innerText = `${t.months[month]} ${day}, ${year}`;
    
    const list = document.getElementById('shift-list');
    list.innerHTML = '';
    
    const savedData = JSON.parse(localStorage.getItem(`shifts-${year}-${month}-${day}`) || "[]");
    
    if (savedData.length === 0) {
        addShiftRow(); 
    } else {
        savedData.forEach(shift => addShiftRow(shift.name, shift.time));
    }
    document.getElementById('day-modal').style.display = 'block';
    const savedEvent = localStorage.getItem(`event-${year}-${month}-${day}`) || "";
    document.getElementById('event-name').value = savedEvent;
}

function addShiftRow(name = '', time = '') {
    const list = document.getElementById('shift-list');
    const row = document.createElement('div');
    
    const c1 = localStorage.getItem('custom-label-1') || 'Custom 1';
    const c2 = localStorage.getItem('custom-label-2') || 'Custom 2';
    const c3 = localStorage.getItem('custom-label-3') || 'Custom 3';

    const lang = localStorage.getItem('preferredLang') || 'en';
    const t = translations[lang];

    row.innerHTML = `
        <div style="display: flex; gap: 0.3125rem; margin-bottom: 0.5rem;">
            <input type="text" placeholder="${t.namePlaceholder}" value="${name}" style="flex:2; padding:0.5rem;">
            <input type="text" class="time-input" placeholder="${t.timePlaceholder}" value="${time}" 
                   onfocus="this.parentElement.nextElementSibling.style.display='grid'" 
                   style="flex:1; padding:0.5rem;">
            <button onclick="this.parentElement.parentElement.remove()" style="background:#a00; padding:0.3125rem 0.625rem; border:none; color:white; border-radius:0.25rem;">X</button>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.3125rem;">
            <button type="button" onclick="selectTime(this, '7a-3p')" style="font-size:0.65rem; background:#444; padding:0.375rem 0.125rem;">7a-3p</button>
            <button type="button" onclick="selectTime(this, '11a-5p')" style="font-size:0.65rem; background:#444; padding:0.375rem 0.125rem;">11a-5p</button>
            <button type="button" onclick="selectTime(this, '5p-Cl')" style="font-size:0.65rem; background:#444; padding:0.375rem 0.125rem;">5p-Cl</button>
            
            <button type="button" onclick="selectTime(this, '${c1}')" style="font-size:0.65rem; background:#222; border:0.0625rem solid #555; padding:0.375rem 0.125rem;">${c1}</button>
            <button type="button" onclick="selectTime(this, '${c2}')" style="font-size:0.65rem; background:#222; border:0.0625rem solid #555; padding:0.375rem 0.125rem;">${c2}</button>
            <button type="button" onclick="selectTime(this, '${c3}')" style="font-size:0.65rem; background:#222; border:0.0625rem solid #555; padding:0.375rem 0.125rem;">${c3}</button>
        </div>
    `;
    list.appendChild(row);
}

function saveDailyShifts() {
    const list = document.getElementById('shift-list');
    const rows = Array.from(list.children); 
    const shiftData = [];
    
    rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        if(inputs[0] && inputs[0].value.trim() !== "") { 
            shiftData.push({ 
                name: inputs[0].value.trim(), 
                time: inputs[1].value.trim() 
            });
        }
    });

    // Use the stored day, month, and year object
    const { day, month, year } = currentEditingDay;
    
    localStorage.setItem(`shifts-${year}-${month}-${day}`, JSON.stringify(shiftData));
    const eventVal = document.getElementById('event-name').value;
    localStorage.setItem(`event-${year}-${month}-${day}`, eventVal); 

    closeModal();
    initCalendar(); 
}

function selectTime(btn, timeValue) {
    const row = btn.closest('#shift-list > div'); // More specific selector
    const timeInput = row.querySelector('.time-input');
    timeInput.value = timeValue;
    btn.parentElement.style.display = 'none'; 
}

function closeModal() {
    document.getElementById('day-modal').style.display = 'none';
}

function saveCustomLabels() {
    const c1 = document.getElementById('custom-1').value;
    const c2 = document.getElementById('custom-2').value;
    const c3 = document.getElementById('custom-3').value;
    
    localStorage.setItem('custom-label-1', c1);
    localStorage.setItem('custom-label-2', c2);
    localStorage.setItem('custom-label-3', c3);
    
    const lang = localStorage.getItem('preferredLang') || 'en';
    alert(translations[lang].alertLabelsSaved);
    document.getElementById('custom-settings').style.display = 'none';
}

function saveSchedule() {
    // Collect all schedule data from localStorage
    const allData = {};
    for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith('shifts-') || key.startsWith('custom-label')) {
            allData[key] = localStorage.getItem(key);
        }
    }

    // Create a blob and download it as a JSON file
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allData));
    const downloadAnchorNode = document.createElement('a');
    downloadAnchorNode.setAttribute("href", dataStr);
    downloadAnchorNode.setAttribute("download", "staff_schedule_backup.json");
    document.body.appendChild(downloadAnchorNode);
    downloadAnchorNode.click();
    downloadAnchorNode.remove();
    
    const lang = localStorage.getItem('preferredLang') || 'en';
    alert(translations[lang].alertBackupDownloaded);
}

function exportToPDF() {
    // Set a clean filename for when they save it
    const month = document.getElementById('month-name').innerText;
    const originalTitle = document.title;
    document.title = `Staff_Schedule_${month.replace(/\s+/g, '_')}`;

    // Open the system print dialog
    window.print();

    // Restore the original tab title
    document.title = originalTitle;
}

// TOP CONTROLS
function clearEntireSchedule() {
    const lang = localStorage.getItem('preferredLang') || 'en';
    const t = translations[lang];

    if (confirm(t.alertClearAll)) {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let day = 1; day <= daysInMonth; day++) {
            localStorage.removeItem(`shifts-${year}-${month}-${day}`);
        }
        initCalendar();
    }
}

function forwardSchedule() {
    const lang = localStorage.getItem('preferredLang') || 'en';
    const message = encodeURIComponent(translations[lang].whatsappMsg);
    
    // Using the 'send' API which is more aggressive at opening the desktop app
    const whatsappUrl = `https://api.whatsapp.com/send?text=${message}`;
    
    window.open(whatsappUrl, '_blank');
}

function toggleViewMode() {
    const lang = localStorage.getItem('preferredLang') || 'en';
    const t = translations[lang];

    const isViewMode = confirm(t.alertViewMode);
    
    if (isViewMode) {
        // 1. Hide the top control buttons
        document.querySelector('.controls').style.display = 'none';
        
        // 2. Disable clicking on the days
        const days = document.querySelectorAll('.calendar-day');
        days.forEach(day => {
            day.onclick = null;
            day.style.cursor = 'default';
        });
        
        // 3. Add a small indicator
        const indicator = document.createElement('div');
        indicator.innerHTML = `<strong>${t.viewOnlyIndicator}</strong>`;
        indicator.style.cssText = "color: white; background: #c00; padding: 0.3125rem 1.25rem; border-radius: 1.25rem; margin-bottom: 0.625rem;";
        document.body.prepend(indicator);
    }
}

function copyPreviousWeek() {
    const lang = localStorage.getItem('preferredLang') || 'en';
    const t = translations[lang];

    if (!confirm(t.alertCopyWeek)) return;

    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const today = now.getDate();
    
    // Find the start of the current week (Sunday)
    const currentDayOfWeek = now.getDay();
    const startOfThisWeek = today - currentDayOfWeek;

    // Loop through the 7 days of the week
    for (let i = 0; i < 7; i++) {
        const targetDay = startOfThisWeek + i;
        const sourceDay = targetDay - 7;

        // Only copy if the source day exists in this month
        if (sourceDay > 0) {
            const sourceKey = `shifts-${year}-${month}-${sourceDay}`;
            const targetKey = `shifts-${year}-${month}-${targetDay}`;
            
            const sourceData = localStorage.getItem(sourceKey);
            const sourceEvent = localStorage.getItem(`event-${year}-${month}-${sourceDay}`);

            if (sourceData) {
                localStorage.setItem(targetKey, sourceData);
            }
            if (sourceEvent) {
                localStorage.setItem(`event-${year}-${month}-${targetDay}`, sourceEvent);
            }
        }
    }

    alert(t.alertWeekCopied);
    initCalendar(); // Refresh the view
}

// On page load, apply saved language and initialize calendar
window.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('preferredLang') || 'en';
    applyLanguage(savedLang);
    initCalendar();
});

</script>
