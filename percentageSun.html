<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>percentageSun</title>

<style>
body {
    background-color: #ff914d;
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    box-sizing: border-box;
}

/* Navigation Group Container */
.nav-group {
    position: absolute;
    top: 1.25rem;
    left: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.625rem;
}

/* Uniform button styling */
.back-btn {
    padding: 0.45rem 0.75rem;
    font-size: 0.9rem;
    font-weight: bold;
    color: rgba(255, 255, 255, 0.8);
    background-color: rgba(255, 255, 255, 0.1);
    border: 0.1rem solid rgba(255, 255, 255, 0.3);
    border-radius: 1rem;
    text-decoration: none;
    text-align: center;
    transition: background-color 0.2s, color 0.2s;
}

.back-btn:hover {
    background-color: rgba(255, 255, 255, 0.2);
    color: white;
}

.mascot-popup {
    background: white;
    border: 0.2rem solid #000099;
    padding: 1rem;
    border-radius: 1rem;
    margin-bottom: 2rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.625rem;
    max-width: 40rem;
    text-align: center;
}

.mascot-emoji { font-size: 2.5rem; transform: rotate(-15deg); }

h1 {
    color: white;
    font-size: 2.2rem;
    text-shadow: 0.15rem 0.15rem 0.3rem rgba(0,0,0,0.2);
    margin-bottom: 2rem;
    text-align: center;
}

.math-card {
    background: white;
    padding: 2rem 1.25rem;
    border-radius: 1.25rem;
    box-shadow: 0 0.3rem 0.6rem rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 30rem;
    box-sizing: border-box;
}

.math-sentence {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.625rem;
    margin-bottom: 2rem;
    width: 100%;
}

.lunar-input {
    width: 15%;
    min-width: 4rem;
    padding: 0.625rem;
    font-size: 1.2rem;
    text-align: center;
    border: 0.2rem solid #ff914d;
    border-radius: 0.8rem;
    outline: none;
    font-weight: bold;
    color: #333;
}

#c-tot, #c-res { width: 20%; min-width: 5rem; }

.math-label { font-size: 1.3rem; font-weight: bold; color: #555; padding: 0 0.3rem; }

.btn-group { display: flex; gap: 0.625rem; width: 100%; justify-content: center; }

.action-btn {
    padding: 0.625rem 1.25rem;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    border-radius: 0.8rem;
    cursor: pointer;
    box-shadow: 0 0.25rem 0.4rem rgba(0,0,0,0.1);
    transition: transform 0.1s;
}

.action-btn:active { transform: scale(0.97); }

#c-submit { background-color: #ff914d; color: white; }
#clearMoonBtn { background-color: #e0e0e0; color: #444; }
</style>
</head>
<body>

    <div class="nav-group">
        <a href="index.html" class="back-btn">← Waiter World</a>
        <a href="app.html" class="back-btn">← Tip Jar</a>
    </div>

    <h1>Percentage Calculator</h1>

    <div class="mascot-popup">
        <span class="mascot-emoji">🤡👉</span> 
        <span>Give us ANY two numbers and<br>the sun will calculate the third,<br>Gratis!</span>
    </div>

    <div class="math-card">
        <div class="math-sentence">
            <input type="number" id="c-pc" placeholder="%" class="lunar-input" min="0"> 
            <span class="math-label">of</span>
            <input type="number" id="c-tot" placeholder="total" class="lunar-input" min="0"> 
            <span class="math-label">=</span>
            <input type="number" id="c-res" placeholder="answer" class="lunar-input" min="0">
        </div>

        <div class="btn-group">
            <button id="c-submit" class="action-btn" onclick="runMoonMath(event)">Submit</button>
            <button id="clearMoonBtn" class="action-btn" onclick="clearMoonFields(event)">Clear</button>
        </div>
    </div>
    
<script>
    function runMoonMath(event) {
        if (event) event.preventDefault();
        const percentInput = document.getElementById('c-pc');
        const totalInput = document.getElementById('c-tot');
        const answerInput = document.getElementById('c-res');

        let p = percentInput.value !== "" ? parseFloat(percentInput.value) : null;
        let t = totalInput.value !== "" ? parseFloat(totalInput.value) : null;
        let a = answerInput.value !== "" ? parseFloat(answerInput.value) : null;

        if (p !== null && t !== null && a === null) {
            answerInput.value = ((p / 100) * t).toFixed(2);
        } else if (t !== null && a !== null && p === null) {
            if (t === 0) { alert("Total cannot be zero!"); return; }
            percentInput.value = ((a / t) * 100).toFixed(1);
        } else if (p !== null && a !== null && t === null) {
            if (p === 0) { alert("Percentage cannot be zero!"); return; }
            totalInput.value = ((a / p) * 100).toFixed(2);
        } else {
            alert("Please enter exactly TWO numbers.");
        }
    }

    function clearMoonFields(event) {
        if (event) event.preventDefault();
        document.getElementById('c-pc').value = "";
        document.getElementById('c-tot').value = "";
        document.getElementById('c-res').value = "";
    }
</script>
</body>
</html>
